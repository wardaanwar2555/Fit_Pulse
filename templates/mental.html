<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Chatbot - FitPulse Health</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 255, 150, 0.6);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        
        .page-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .page-subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .chat-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 150, 0.2);
            height: 600px;
            display: flex;
            flex-direction: column;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 150, 0.5);
            border-radius: 10px;
        }
        
        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user {
            display: flex;
            justify-content: flex-end;
        }
        
        .message-bot {
            display: flex;
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.5;
        }
        
        .message-user .message-content {
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            color: #0f0f23;
            border-bottom-right-radius: 5px;
        }
        
        .message-bot .message-content {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(0, 255, 150, 0.3);
            border-bottom-left-radius: 5px;
        }
        
        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(0, 255, 150, 0.3);
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            max-width: 70px;
        }
        
        .typing-indicator.active {
            display: block;
        }
        
        .typing-dots {
            display: flex;
            gap: 5px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #00ff96;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .chat-input-container {
            display: flex;
            gap: 10px;
        }
        
        .chat-input {
            flex: 1;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 150, 0.3);
            border-radius: 15px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #00ff96;
            background: rgba(255, 255, 255, 0.15);
        }
        
        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .send-btn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            color: #0f0f23;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 150, 0.4);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .welcome-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .chip {
            padding: 10px 20px;
            background: rgba(0, 255, 150, 0.1);
            border: 2px solid rgba(0, 255, 150, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .chip:hover {
            background: rgba(0, 255, 150, 0.2);
            border-color: #00ff96;
            transform: translateY(-2px);
        }
        
        .error-message {
            background: rgba(255, 50, 50, 0.2);
            border: 2px solid rgba(255, 50, 50, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .message-content {
                max-width: 85%;
            }
            
            .page-title {
                font-size: 2rem;
            }
            
            .chat-container {
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <div class="logo">🧠 FitPulse Health</div>
            <h1 class="page-title">Mental Health Support</h1>
            <p class="page-subtitle">Your AI companion for mental wellness and emotional support</p>
        </div>
        
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <div class="welcome-icon">💚</div>
                    <h3>Welcome to Mental Health Support</h3>
                    <p>I'm here to listen and provide support. How are you feeling today?</p>
                    
                    <div class="suggestion-chips">
                        <div class="chip" onclick="sendSuggestion('I\'m feeling stressed')">😰 Feeling stressed</div>
                        <div class="chip" onclick="sendSuggestion('I need motivation')">💪 Need motivation</div>
                        <div class="chip" onclick="sendSuggestion('Tips for better sleep')">😴 Sleep tips</div>
                        <div class="chip" onclick="sendSuggestion('Managing anxiety')">😌 Managing anxiety</div>
                    </div>
                </div>
            </div>
            
            <div class="message message-bot">
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-container">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="Share what's on your mind..."
                    onkeypress="handleKeyPress(event)"
                >
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <span>Send</span>
                    <span>📨</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        // API Configuration
        const API_KEY = 'YOUR_OPENROUTER_API_KEY'; // Replace with your actual API key
        
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        
        let conversationHistory = [
            {
                role: "system",
                content: "You are a compassionate mental health support assistant. Provide empathetic, supportive responses. Always encourage users to seek professional help for serious concerns. Be warm, understanding, and non-judgmental. Keep responses concise but caring."
            }
        ];
        
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        function sendSuggestion(text) {
            chatInput.value = text;
            sendMessage();
        }
        
        async function sendMessage() {
            const message = chatInput.value.trim();
            
            if (!message) return;
            
            // Clear welcome message on first interaction
            const welcomeMsg = document.querySelector('.welcome-message');
            if (welcomeMsg) {
                welcomeMsg.style.display = 'none';
            }
            
            // Add user message to chat
            addMessage(message, 'user');
            chatInput.value = '';
            
            // Add to conversation history
            conversationHistory.push({
                role: "user",
                content: message
            });
            
            // Show typing indicator
            typingIndicator.classList.add('active');
            sendBtn.disabled = true;
            
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer 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`,
                        "HTTP-Referer": "https://fitpulse-health.com",
                        "X-Title": "FitPulse Mental Health Chatbot",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "meta-llama/llama-3.3-70b-instruct:free",
                        "messages": conversationHistory
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const data = await response.json();
                const botMessage = data.choices[0].message.content;
                
                // Add to conversation history
                conversationHistory.push({
                    role: "assistant",
                    content: botMessage
                });
                
                // Add bot message to chat
                typingIndicator.classList.remove('active');
                addMessage(botMessage, 'bot');
                
            } catch (error) {
                console.error('Error:', error);
                typingIndicator.classList.remove('active');
                addMessage('I apologize, but I\'m having trouble connecting right now. Please try again in a moment. If you\'re in crisis, please reach out to a mental health professional or crisis hotline immediately.', 'bot', true);
            } finally {
                sendBtn.disabled = false;
                chatInput.focus();
            }
        }
        
        function addMessage(text, sender, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (isError) {
                contentDiv.style.background = 'rgba(255, 50, 50, 0.2)';
                contentDiv.style.borderColor = 'rgba(255, 50, 50, 0.5)';
            }
            
            contentDiv.textContent = text;
            messageDiv.appendChild(contentDiv);
            
            // Insert before typing indicator
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Particle Background
        const particlesContainer = document.getElementById('particles');
        const numParticles = 100;

        for (let i = 0; i < numParticles; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.top = Math.random() * 100 + 'vh';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = Math.random() * 6 + 's';
            particle.style.width = particle.style.height = (Math.random() * 3 + 2) + 'px';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
