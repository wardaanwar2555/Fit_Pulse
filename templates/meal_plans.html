<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Calculator - FitPulse Health</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 255, 150, 0.6);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        
        .page-title {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #fff, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .page-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
            margin-bottom: 50px;
        }
        
        .calculator-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 150, 0.2);
            height: fit-content;
        }
        
        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
            text-align: center;
        }
        
        .card-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #00ff96;
            font-weight: 600;
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 150, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #00ff96;
            background: rgba(255, 255, 255, 0.15);
        }
        
        .form-select option {
            background: #1a1a2e;
            color: #fff;
        }
        
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 8px;
        }
        
        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .radio-input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            accent-color: #00ff96;
        }
        
        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            color: #0f0f23;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 150, 0.4);
        }
        
        .results-section {
            display: block;
        }
        
        .result-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 150, 0.2);
            margin-bottom: 30px;
        }
        
        .result-title {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .calorie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .calorie-item {
            background: rgba(0, 255, 150, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 2px solid rgba(0, 255, 150, 0.3);
            transition: all 0.3s ease;
        }
        
        .calorie-item:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 150, 0.6);
        }
        
        .calorie-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00ff96;
            display: block;
            margin-bottom: 5px;
        }
        
        .calorie-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            display: block;
        }
        
        .calorie-sublabel {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            display: block;
            margin-top: 5px;
        }
        
        .zigzag-title {
            font-size: 1.5rem;
            color: #00d4ff;
            margin: 30px 0 15px 0;
        }
        
        .zigzag-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .zigzag-table th {
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            color: #0f0f23;
            padding: 15px;
            font-weight: bold;
            text-align: left;
        }
        
        .zigzag-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .zigzag-table tr:hover {
            background: rgba(0, 255, 150, 0.1);
        }
        
        .diet-btn {
            padding: 12px 25px;
            background: linear-gradient(45deg, #9C27B0, #E91E63);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .diet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(156, 39, 176, 0.4);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 150, 0.3);
            border-top: 4px solid #00ff96;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .section-divider {
            margin: 60px 0;
            text-align: center;
        }
        
        .section-divider-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 150, 0.5), transparent);
            margin: 20px 0;
        }
        
        .filter-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 150, 0.2);
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .filter-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 150, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover {
            background: rgba(0, 255, 150, 0.2);
            border-color: #00ff96;
            transform: translateY(-2px);
        }
        
        .filter-btn.active {
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            color: #0f0f23;
            border-color: transparent;
            font-weight: bold;
        }
        
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 150, 0.2);
        }
        
        .chart-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .food-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(0, 255, 150, 0.2);
            transition: all 0.3s ease;
        }
        
        .food-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 150, 0.6);
            background: rgba(0, 255, 150, 0.1);
        }
        
        .food-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .food-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ff96;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .food-calories {
            font-size: 2rem;
            color: #00d4ff;
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .food-serving {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }
        
        .calorie-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .calorie-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff96, #00d4ff);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
            .food-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <div class="logo">🔥 FitPulse Health</div>
            <h1 class="page-title">Food & Calorie Chart</h1>
            <p class="page-subtitle">Visual guide to calories in common foods</p>
        </div>
        
        <div class="filter-section">
            <h3 style="color: #00ff96; margin-bottom: 15px;">Filter by Category</h3>
            <div class="filter-grid">
                <button class="filter-btn active" onclick="filterCategory('all')">All Foods</button>
                <button class="filter-btn" onclick="filterCategory('fruits')">🍎 Fruits</button>
                <button class="filter-btn" onclick="filterCategory('vegetables')">🥗 Vegetables</button>
                <button class="filter-btn" onclick="filterCategory('proteins')">🍗 Proteins</button>
                <button class="filter-btn" onclick="filterCategory('grains')">🌾 Grains</button>
                <button class="filter-btn" onclick="filterCategory('dairy')">🥛 Dairy</button>
                <button class="filter-btn" onclick="filterCategory('snacks')">🍿 Snacks</button>
            </div>
        </div>
        
        <div class="chart-grid">
            <div class="chart-card">
                <h3 class="chart-title">📊 Calories by Category</h3>
                <canvas id="categoryChart"></canvas>
            </div>
            
            <div class="chart-card">
                <h3 class="chart-title">🥇 Top 10 High-Calorie Foods</h3>
                <canvas id="highCalorieChart"></canvas>
            </div>
        </div>
        
        <div class="chart-card" style="margin-bottom: 30px;">
            <h3 class="chart-title">📈 Calorie Comparison</h3>
            <canvas id="comparisonChart"></canvas>
        </div>
        
        <div class="food-grid" id="foodGrid"></div>
    </div>
    
    <script>
        const foodData = {
            fruits: [
                {name: 'Apple', icon: '🍎', calories: 95, serving: '1 medium (182g)'},
                {name: 'Banana', icon: '🍌', calories: 105, serving: '1 medium (118g)'},
                {name: 'Orange', icon: '🍊', calories: 62, serving: '1 medium (131g)'},
                {name: 'Strawberries', icon: '🍓', calories: 49, serving: '1 cup (152g)'},
                {name: 'Grapes', icon: '🍇', calories: 104, serving: '1 cup (151g)'},
                {name: 'Watermelon', icon: '🍉', calories: 46, serving: '1 cup (154g)'},
                {name: 'Mango', icon: '🥭', calories: 135, serving: '1 cup (165g)'},
                {name: 'Pineapple', icon: '🍍', calories: 82, serving: '1 cup (165g)'}
            ],
            vegetables: [
                {name: 'Broccoli', icon: '🥦', calories: 31, serving: '1 cup (91g)'},
                {name: 'Carrots', icon: '🥕', calories: 52, serving: '1 cup (128g)'},
                {name: 'Spinach', icon: '🥬', calories: 7, serving: '1 cup (30g)'},
                {name: 'Tomato', icon: '🍅', calories: 22, serving: '1 medium (123g)'},
                {name: 'Cucumber', icon: '🥒', calories: 16, serving: '1 cup (104g)'},
                {name: 'Bell Pepper', icon: '🫑', calories: 37, serving: '1 medium (119g)'},
                {name: 'Lettuce', icon: '🥗', calories: 5, serving: '1 cup (36g)'},
                {name: 'Cauliflower', icon: '🥦', calories: 25, serving: '1 cup (100g)'}
            ],
            proteins: [
                {name: 'Chicken Breast', icon: '🍗', calories: 165, serving: '100g cooked'},
                {name: 'Salmon', icon: '🐟', calories: 206, serving: '100g cooked'},
                {name: 'Eggs', icon: '🥚', calories: 155, serving: '2 large eggs'},
                {name: 'Ground Beef', icon: '🥩', calories: 250, serving: '100g cooked'},
                {name: 'Tuna', icon: '🐟', calories: 132, serving: '100g canned'},
                {name: 'Tofu', icon: '🥡', calories: 76, serving: '100g'},
                {name: 'Black Beans', icon: '🫘', calories: 132, serving: '1/2 cup (86g)'},
                {name: 'Pork Chop', icon: '🥓', calories: 231, serving: '100g cooked'}
            ],
            grains: [
                {name: 'Brown Rice', icon: '🍚', calories: 216, serving: '1 cup cooked'},
                {name: 'Quinoa', icon: '🌾', calories: 222, serving: '1 cup cooked'},
                {name: 'Oatmeal', icon: '🥣', calories: 166, serving: '1 cup cooked'},
                {name: 'Whole Wheat Bread', icon: '🍞', calories: 81, serving: '1 slice'},
                {name: 'Pasta', icon: '🍝', calories: 221, serving: '1 cup cooked'},
                {name: 'White Rice', icon: '🍚', calories: 205, serving: '1 cup cooked'},
                {name: 'Corn', icon: '🌽', calories: 96, serving: '1 medium ear'},
                {name: 'Sweet Potato', icon: '🍠', calories: 112, serving: '1 medium'}
            ],
            dairy: [
                {name: 'Whole Milk', icon: '🥛', calories: 149, serving: '1 cup (244g)'},
                {name: 'Cheddar Cheese', icon: '🧀', calories: 113, serving: '1 oz (28g)'},
                {name: 'Greek Yogurt', icon: '🥛', calories: 100, serving: '6 oz (170g)'},
                {name: 'Mozzarella', icon: '🧀', calories: 85, serving: '1 oz (28g)'},
                {name: 'Butter', icon: '🧈', calories: 102, serving: '1 tbsp (14g)'},
                {name: 'Cream Cheese', icon: '🧀', calories: 99, serving: '2 tbsp (29g)'},
                {name: 'Cottage Cheese', icon: '🥛', calories: 163, serving: '1 cup (226g)'},
                {name: 'Ice Cream', icon: '🍨', calories: 207, serving: '1/2 cup (66g)'}
            ],
            snacks: [
                {name: 'Almonds', icon: '🥜', calories: 164, serving: '1 oz (28g)'},
                {name: 'Peanut Butter', icon: '🥜', calories: 188, serving: '2 tbsp (32g)'},
                {name: 'Potato Chips', icon: '🥔', calories: 152, serving: '1 oz (28g)'},
                {name: 'Popcorn', icon: '🍿', calories: 31, serving: '1 cup popped'},
                {name: 'Dark Chocolate', icon: '🍫', calories: 155, serving: '1 oz (28g)'},
                {name: 'Granola Bar', icon: '🍪', calories: 120, serving: '1 bar (28g)'},
                {name: 'Pretzels', icon: '🥨', calories: 108, serving: '1 oz (28g)'},
                {name: 'Trail Mix', icon: '🥜', calories: 131, serving: '1 oz (28g)'}
            ]
        };

        let currentCategory = 'all';
        const maxCalories = 250;

        function renderFoodCards() {
            const grid = document.getElementById('foodGrid');
            grid.innerHTML = '';
            
            const categories = currentCategory === 'all' ? Object.keys(foodData) : [currentCategory];
            
            categories.forEach(category => {
                foodData[category].forEach(food => {
                    const card = document.createElement('div');
                    card.className = 'food-card';
                    const percentage = (food.calories / maxCalories) * 100;
                    
                    card.innerHTML = `
                        <div class="food-icon">${food.icon}</div>
                        <div class="food-name">${food.name}</div>
                        <div class="food-calories">${food.calories}</div>
                        <div class="food-serving">${food.serving}</div>
                        <div class="calorie-bar">
                            <div class="calorie-fill" style="width: ${percentage}%"></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderFoodCards();
        }

        // Category Chart
        const categoryCtx = document.getElementById('categoryChart').getContext('2d');
        const categoryAverages = {};
        Object.keys(foodData).forEach(cat => {
            const avg = foodData[cat].reduce((sum, food) => sum + food.calories, 0) / foodData[cat].length;
            categoryAverages[cat] = Math.round(avg);
        });

        new Chart(categoryCtx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(categoryAverages).map(c => c.charAt(0).toUpperCase() + c.slice(1)),
                datasets: [{
                    data: Object.values(categoryAverages),
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.8)',
                        'rgba(54, 162, 235, 0.8)',
                        'rgba(255, 206, 86, 0.8)',
                        'rgba(75, 192, 192, 0.8)',
                        'rgba(153, 102, 255, 0.8)',
                        'rgba(255, 159, 64, 0.8)'
                    ],
                    borderColor: 'rgba(0, 255, 150, 0.3)',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#fff', font: { size: 12 } }
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.label}: ${context.parsed} cal (avg)`
                        }
                    }
                }
            }
        });

        // High Calorie Chart
        const allFoods = Object.values(foodData).flat();
        const topFoods = allFoods.sort((a, b) => b.calories - a.calories).slice(0, 10);

        const highCalCtx = document.getElementById('highCalorieChart').getContext('2d');
        new Chart(highCalCtx, {
            type: 'bar',
            data: {
                labels: topFoods.map(f => f.name),
                datasets: [{
                    label: 'Calories',
                    data: topFoods.map(f => f.calories),
                    backgroundColor: 'rgba(0, 255, 150, 0.7)',
                    borderColor: 'rgba(0, 255, 150, 1)',
                    borderWidth: 2
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.parsed.x} calories`
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#fff' },
                        grid: { color: 'rgba(255, 255, 255, 0.1)' }
                    },
                    y: {
                        ticks: { color: '#fff' },
                        grid: { color: 'rgba(255, 255, 255, 0.1)' }
                    }
                }
            }
        });

        // Comparison Chart
        const comparisonFoods = [
            foodData.fruits[0], foodData.vegetables[0], foodData.proteins[0],
            foodData.grains[0], foodData.dairy[0], foodData.snacks[0]
        ];

        const compCtx = document.getElementById('comparisonChart').getContext('2d');
        new Chart(compCtx, {
            type: 'line',
            data: {
                labels: comparisonFoods.map(f => f.name),
                datasets: [{
                    label: 'Calories per Serving',
                    data: comparisonFoods.map(f => f.calories),
                    fill: true,
                    backgroundColor: 'rgba(0, 212, 255, 0.2)',
                    borderColor: 'rgba(0, 212, 255, 1)',
                    borderWidth: 3,
                    tension: 0.4,
                    pointBackgroundColor: 'rgba(0, 255, 150, 1)',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { color: '#fff', font: { size: 14 } }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#fff' },
                        grid: { color: 'rgba(255, 255, 255, 0.1)' }
                    },
                    y: {
                        ticks: { color: '#fff' },
                        grid: { color: 'rgba(255, 255, 255, 0.1)' }
                    }
                }
            }
        });

        // Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 100; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.top = Math.random() * 100 + 'vh';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = Math.random() * 6 + 's';
            particle.style.width = particle.style.height = (Math.random() * 3 + 2) + 'px';
            particlesContainer.appendChild(particle);
        }

        renderFoodCards();
    </script>
</body>
</html>
