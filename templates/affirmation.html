<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Inspiration - FitPulse Health</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 255, 150, 0.6);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        
        .page-title {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #fff, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .page-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .tab-btn {
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 150, 0.3);
            border-radius: 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab-btn:hover {
            border-color: #00ff96;
            color: #fff;
            transform: translateY(-2px);
        }
        
        .tab-btn.active {
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            color: #0f0f23;
            border-color: transparent;
        }
        
        .slider-container {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .slider {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                        url('https://tse4.mm.bing.net/th/id/OIP.H0A4PaXaYaFV8_mnM4Q4DQHaE9?cb=12&pid=ImgDet&w=474&h=317&rs=1&o=7&rm=3') center/cover;
      
            border-radius: 25px;
            padding: 60px 80px;


            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .slider::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 255, 150, 0.08) 0%, rgba(0, 212, 255, 0.08) 100%);
            z-index: 0;
        }
        
        .slide {
            position: relative;
            z-index: 1;
        }
        
        .slide {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }
        
        .slide.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .quote-icon {
            font-size: 4rem;
            margin-bottom: 30px;
            opacity: 0.3;
        }
        
        .quote-text {
            font-size: 2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            font-style: italic;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            font-weight: 500;
        }
        
        .quote-author {
            font-size: 1.3rem;
            color: #00d4ff;
            font-weight: bold;
        }
        
        .affirmation-text {
            font-size: 2.5rem;
            line-height: 1.5;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 255, 150, 0.2);
            border: 2px solid rgba(0, 255, 150, 0.5);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
            color: #00ff96;
        }
        
        .nav-btn:hover {
            background: rgba(0, 255, 150, 0.4);
            transform: translateY(-50%) scale(1.1);
        }
        
        .nav-btn.prev {
            left: -80px;
        }
        
        .nav-btn.next {
            right: -80px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 150, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-btn:hover {
            background: rgba(0, 255, 150, 0.2);
            border-color: #00ff96;
            transform: translateY(-2px);
        }
        
        .control-btn.active {
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            color: #0f0f23;
            border-color: transparent;
        }
        
        .indicator-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .dot.active {
            background: #00ff96;
            width: 30px;
            border-radius: 6px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 150, 0.3);
            border-top: 4px solid #00ff96;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .api-source {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 150, 0.2);
        }
        
        .api-source-title {
            color: #00ff96;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .api-source-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .slider {
                padding: 40px 30px;
                min-height: 300px;
            }
            
            .quote-text {
                font-size: 1.5rem;
            }
            
            .affirmation-text {
                font-size: 1.8rem;
            }
            
            .nav-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            
            .nav-btn.prev {
                left: -60px;
            }
            
            .nav-btn.next {
                right: -60px;
            }
            
            .page-title {
                font-size: 2rem;
            }
            
            .tabs {
                flex-direction: column;
                align-items: center;
            }
            
            .tab-btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <div class="logo">✨ FitPulse Health</div>
            <h1 class="page-title">Daily Inspiration</h1>
            <p class="page-subtitle">Motivational quotes and affirmations to brighten your day</p>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('quotes')">💭 Quotes</button>
            <button class="tab-btn" onclick="switchTab('affirmations')">🌟 Affirmations</button>
        </div>
        
        <div class="slider-container">
            <div class="slider" id="slider">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 20px; color: rgba(255, 255, 255, 0.7);">Loading inspiration...</p>
                </div>
            </div>
            
            <div class="nav-btn prev" onclick="previousSlide()">‹</div>
            <div class="nav-btn next" onclick="nextSlide()">›</div>
        </div>
        
        <div class="indicator-dots" id="indicators"></div>
        
        <div class="controls">
            <button class="control-btn" onclick="loadNewContent()">
                <span>🔄</span>
                <span>Load New</span>
            </button>
            <button class="control-btn" id="autoplayBtn" onclick="toggleAutoplay()">
                <span>▶️</span>
                <span>Auto Play</span>
            </button>
            <button class="control-btn" onclick="shareContent()">
                <span>📤</span>
                <span>Share</span>
            </button>
        </div>
        
        <div class="api-source">
            <div class="api-source-title">📡 Content Source</div>
            <div class="api-source-text" id="apiSource">Loading from various APIs...</div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        let slides = [];
        let currentMode = 'quotes'; // 'quotes' or 'affirmations'
        let autoplayInterval = null;
        let isAutoplay = false;

        // API endpoints for quotes
        const quoteAPIs = [
            {
                name: 'ZenQuotes',
                url: 'https://zenquotes.io/api/quotes',
                parse: (data) => data.map(item => ({
                    text: item.q,
                    author: item.a,
                    type: 'quote'
                }))
            },
            {
                name: 'Quotable',
                url: 'https://api.quotable.io/quotes/random?limit=10',
                parse: (data) => data.map(item => ({
                    text: item.content,
                    author: item.author,
                    type: 'quote'
                }))
            }
        ];

        // Fallback quotes if API fails
        const fallbackQuotes = [
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs", type: "quote" },
            { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt", type: "quote" },
            { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill", type: "quote" },
            { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt", type: "quote" },
            { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius", type: "quote" }
        ];

        // Affirmations
        const affirmations = [
            { text: "I am capable of achieving my goals", type: "affirmation" },
            { text: "I choose to be happy and grateful today", type: "affirmation" },
            { text: "I am worthy of love and respect", type: "affirmation" },
            { text: "Every day I am becoming a better version of myself", type: "affirmation" },
            { text: "I have the power to create positive change", type: "affirmation" },
            { text: "I trust in my journey and embrace my growth", type: "affirmation" },
            { text: "I am strong, resilient, and brave", type: "affirmation" },
            { text: "I radiate confidence and positive energy", type: "affirmation" },
            { text: "I am in control of my thoughts and emotions", type: "affirmation" },
            { text: "I deserve all the good things that come my way", type: "affirmation" }
        ];

        async function loadQuotes() {
            document.getElementById('apiSource').textContent = 'Loading quotes from external APIs...';
            
            // Try each API until one works
            for (let api of quoteAPIs) {
                try {
                    const response = await fetch(api.url);
                    if (response.ok) {
                        const data = await response.json();
                        slides = api.parse(data);
                        document.getElementById('apiSource').textContent = `✅ Quotes loaded from ${api.name} API`;
                        return;
                    }
                } catch (error) {
                    console.log(`Failed to load from ${api.name}:`, error);
                }
            }
            
            // If all APIs fail, use fallback
            slides = fallbackQuotes;
            document.getElementById('apiSource').textContent = '⚠️ Using fallback quotes (API unavailable)';
        }

        function loadAffirmations() {
            slides = [...affirmations];
            document.getElementById('apiSource').textContent = '💫 Affirmations loaded from local collection';
        }

        function renderSlides() {
            const slider = document.getElementById('slider');
            slider.innerHTML = '';
            
            slides.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${index === currentSlide ? 'active' : ''}`;
                
                if (slide.type === 'quote') {
                    slideDiv.innerHTML = `
                        <div class="quote-icon">"</div>
                        <div class="quote-text">${slide.text}</div>
                        <div class="quote-author">— ${slide.author}</div>
                    `;
                } else {
                    slideDiv.innerHTML = `
                        <div class="quote-icon">✨</div>
                        <div class="affirmation-text">${slide.text}</div>
                    `;
                }
                
                slider.appendChild(slideDiv);
            });
            
            renderIndicators();
        }

        function renderIndicators() {
            const indicators = document.getElementById('indicators');
            indicators.innerHTML = '';
            
            slides.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = `dot ${index === currentSlide ? 'active' : ''}`;
                dot.onclick = () => goToSlide(index);
                indicators.appendChild(dot);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlides();
        }

        function previousSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlides();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlides();
        }

        function updateSlides() {
            const allSlides = document.querySelectorAll('.slide');
            allSlides.forEach((slide, index) => {
                slide.classList.toggle('active', index === currentSlide);
            });
            renderIndicators();
        }

        async function switchTab(mode) {
            if (mode === currentMode) return;
            
            currentMode = mode;
            currentSlide = 0;
            
            // Update tab buttons
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Show loading
            document.getElementById('slider').innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 20px; color: rgba(255, 255, 255, 0.7);">Loading ${mode}...</p>
                </div>
            `;
            
            // Load content
            if (mode === 'quotes') {
                await loadQuotes();
            } else {
                loadAffirmations();
            }
            
            renderSlides();
        }

        async function loadNewContent() {
            currentSlide = 0;
            
            document.getElementById('slider').innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 20px; color: rgba(255, 255, 255, 0.7);">Loading new content...</p>
                </div>
            `;
            
            if (currentMode === 'quotes') {
                await loadQuotes();
            } else {
                // Shuffle affirmations
                slides = [...affirmations].sort(() => Math.random() - 0.5);
            }
            
            renderSlides();
        }

        function toggleAutoplay() {
            isAutoplay = !isAutoplay;
            const btn = document.getElementById('autoplayBtn');
            
            if (isAutoplay) {
                btn.classList.add('active');
                btn.innerHTML = '<span>⏸️</span><span>Pause</span>';
                autoplayInterval = setInterval(nextSlide, 5000);
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<span>▶️</span><span>Auto Play</span>';
                clearInterval(autoplayInterval);
            }
        }

        function shareContent() {
            const currentContent = slides[currentSlide];
            let shareText = '';
            
            if (currentContent.type === 'quote') {
                shareText = `"${currentContent.text}" — ${currentContent.author}`;
            } else {
                shareText = currentContent.text;
            }
            
            if (navigator.share) {
                navigator.share({
                    title: 'Daily Inspiration',
                    text: shareText,
                    url: window.location.href
                }).catch(() => {
                    copyToClipboard(shareText);
                });
            } else {
                copyToClipboard(shareText);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Copied to clipboard!');
            }).catch(() => {
                alert('❌ Failed to copy. Please try again.');
            });
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousSlide();
            if (e.key === 'ArrowRight') nextSlide();
        });

        // Initialize
        (async function init() {
            await loadQuotes();
            renderSlides();
            
            // Particle Background
            const particlesContainer = document.getElementById('particles');
            const numParticles = 100;

            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.top = Math.random() * 100 + 'vh';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.width = particle.style.height = (Math.random() * 3 + 2) + 'px';
                particlesContainer.appendChild(particle);
            }
        })();
    </script>
</body>
</html>
